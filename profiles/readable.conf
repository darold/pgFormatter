# Readable PostgreSQL and PL/pgSQL formatting profile.
# Use token-aware wrapping; literal contents may exceed this code width.
max-line-length = 100
spaces = 2
keyword-case = 2
type-case = 1
function-case = 0
keep-newline = 1
nogrouping = 1
format-type = 1
comma-break = 1
redundant-parenthesis = 1
no-space-function = 1

no-extra-line = 1

matching-paren-newline = 1
multiline-functions = 1

multiline-json = 1
