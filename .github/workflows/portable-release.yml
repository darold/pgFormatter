name: Portable release

on:
  push:
    branches: ['**']
    tags: ['v*-samshull.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package and test on Linux
    outputs:
      alpha-tag: ${{ steps.alpha.outputs.tag }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set the automatic alpha version
        id: alpha
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          tag="v5.11.1-samshull.$((2 + GITHUB_RUN_NUMBER))"
          version=${tag#v}
          ALPHA_SUFFIX="-${version#*-}" perl -pi -e 's/-samshull\.\d+(?=\x27)/$ENV{ALPHA_SUFFIX}/' lib/pgFormatter/CLI.pm
          test "$(./pg_format --version)" = "pg_format version $version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Test source and packaging
        run: prove -lr t
      - name: Build portable archive
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            perl scripts/build-release.pl dist "$GITHUB_REF_NAME"
          else
            perl scripts/build-release.pl dist
          fi
      - name: Test the extracted package without source modules
        run: perl scripts/test-release.pl dist/pgFormatter-*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pgformatter-portable
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    name: Publish tested release assets
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: pgformatter-release-${{ needs.package.outputs.alpha-tag || github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pgformatter-portable
          path: dist
      - name: Publish the exact archive tested on Linux
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ALPHA_TAG: ${{ needs.package.outputs.alpha-tag }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          if [[ -n "$ALPHA_TAG" ]]; then
            tag="$ALPHA_TAG"
            release_options=(--target "$GITHUB_SHA" --prerelease)
          else
            tag="$GITHUB_REF_NAME"
            release_options=(--verify-tag)
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release view "$tag" --json assets,isDraft,isPrerelease |
              jq -e --arg archive "pgFormatter-${tag#v}.tar.gz" --arg alpha "$ALPHA_TAG" '
                (.isDraft | not) and ($alpha == "" or .isPrerelease) and
                ([.assets[].name] | index($archive) != null and index("SHA256SUMS") != null)
              ' >/dev/null
            echo "Release $tag already has both assets."
            exit 0
          fi
          gh release create "$tag" ./*.tar.gz SHA256SUMS \
            "${release_options[@]}" --title "$tag" \
            --notes 'Portable pgFormatter CLI package. Requires Perl 5.22 or newer. SHA256SUMS verifies the archive; release.json records the formatter version and source commit. This exact archive passed the Linux packaged regression suite.'
