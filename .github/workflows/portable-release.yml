name: Portable release

on:
  push:
    branches: ['**']
    tags: ['v*-samshull.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package and test on Linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test source and packaging
        run: prove -lr t
      - name: Build portable archive
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            perl scripts/build-release.pl dist "$GITHUB_REF_NAME"
          else
            perl scripts/build-release.pl dist
          fi
      - name: Test the extracted package without source modules
        run: perl scripts/test-release.pl dist/pgFormatter-*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pgformatter-portable
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    name: Publish tested release assets
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: pgformatter-release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pgformatter-portable
          path: dist
      - name: Publish the exact archive tested on Linux
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" ./*.tar.gz SHA256SUMS \
            --verify-tag --title "$RELEASE_TAG" \
            --notes 'Portable pgFormatter CLI package. Requires Perl 5.22 or newer. SHA256SUMS verifies the archive; release.json records the formatter version and source commit. This exact archive passed the Linux packaged regression suite.'
