name: Alpha release

on:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  package:
    outputs:
      tag: ${{ steps.build.outputs.tag }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and test the portable archive
        id: build
        run: |
          tag="v5.11.1-samshull.$((2 + GITHUB_RUN_NUMBER))"
          version=${tag#v}
          ALPHA_SUFFIX="-${version#*-}" perl -pi -e 's/-samshull\.2(?=\x27)/$ENV{ALPHA_SUFFIX}/' lib/pgFormatter/CLI.pm
          test "$(./pg_format --version)" = "pg_format version $version"
          prove -lr t
          perl scripts/build-release.pl dist
          perl scripts/test-release.pl "dist/pgFormatter-$version.tar.gz"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pgformatter-alpha
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pgformatter-alpha
          path: dist
      - name: Publish alpha prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release view "$RELEASE_TAG" --json assets,isDraft,isPrerelease |
              jq -e --arg archive "pgFormatter-${RELEASE_TAG#v}.tar.gz" '
                .isPrerelease and (.isDraft | not) and
                ([.assets[].name] | index($archive) != null and index("SHA256SUMS") != null)
              ' >/dev/null
            echo "Release $RELEASE_TAG already has both assets."
            exit 0
          fi
          gh release create "$RELEASE_TAG" ./*.tar.gz SHA256SUMS \
            --target "$GITHUB_SHA" \
            --prerelease --title "$RELEASE_TAG" --generate-notes
